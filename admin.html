<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pro - SIPANDU SPENPOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #0ea5e9; --bg-color: #f1f5f9; --text-main: #334155; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; align-items: center; justify-content: space-between; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header-title { display: flex; align-items: center; gap: 15px; }
        .header img { width: 60px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .header h1 { margin: 0; font-size: 22px; color: var(--primary); }
        .header p { margin: 0; font-size: 14px; color: #64748b; }
        
        .header-actions button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; margin-left: 5px;}
        .btn-print { background: #475569; color: white; }
        .btn-excel { background: #10b981; color: white; }
        
        .grid-dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: center;}
        .stat-card h3 { margin: 0 0 10px 0; color: #64748b; font-size: 14px; }
        .stat-card span { font-size: 28px; font-weight: 700; color: var(--primary); }
        .chart-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; height: 180px; }

        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; overflow: hidden;}
        
        /* MENU TAB BERWARNA (BARU) */
        .tab-admin { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
        .tab-admin button { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); font-weight: 600; cursor: pointer; transition: all 0.3s ease; background: #f8fafc; color: #64748b; white-space: nowrap;}
        .tab-admin button:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.08); background: white;}
        
        /* Pewarnaan Khusus saat Tab Aktif */
        .tab-admin button[data-tab="Semua"].active { background: #0f172a; color: white; border-color: #0f172a; }
        .tab-admin button[data-tab="Menunggu"].active { background: #f59e0b; color: white; border-color: #f59e0b; }
        .tab-admin button[data-tab="Diverifikasi"].active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .tab-admin button[data-tab="Diproses"].active { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .tab-admin button[data-tab="Selesai"].active { background: #10b981; color: white; border-color: #10b981; }
        .tab-admin button[data-tab="Ditolak"].active { background: #ef4444; color: white; border-color: #ef4444; }

        .toolbar { padding-bottom: 15px; display: flex; gap: 15px; }
        .search-bar { flex: 1; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-family: 'Inter'; background: #f8fafc;}
        .search-bar:focus { border-color: var(--secondary); background: white;}

        /* Tabel */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background-color: #f8fafc; color: var(--primary); font-weight: 600; }
        tr:hover { background-color: #f1f5f9; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; text-align: center; min-width: 80px;}
        .b-menunggu { background: #fef08a; color: #854d0e; }
        .b-diverifikasi { background: #dbeafe; color: #1e40af; }
        .b-diproses { background: #f3e8ff; color: #6b21a8; }
        .b-selesai { background: #bbf7d0; color: #166534; }
        .b-ditolak { background: #fee2e2; color: #991b1b; }

        .btn-kelola { background: var(--secondary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-kelola:hover { background: #0284c7; }
        
        #loading { text-align: center; padding: 40px; font-weight: 600; color: var(--secondary); }

        /* Modal Kelola */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: white; width: 90%; max-width: 500px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid var(--border); font-weight: bold; display: flex; justify-content: space-between;}
        .modal-body { padding: 20px; }
        .modal-body label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; margin-top: 10px; color: var(--primary); }
        .modal-body select, .modal-body textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: 'Inter'; }
        .modal-footer { padding: 15px 20px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
        .btn-batal { padding: 8px 15px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; }
        .btn-simpan { padding: 8px 15px; border: none; background: #0f172a; color: white; border-radius: 6px; cursor: pointer; }

        @media print {
            .header-actions, .toolbar, .tab-admin, .chart-card, .btn-kelola { display: none !important; }
            .grid-dashboard { display: block; }
            .stats { display: flex; margin-bottom: 20px; }
            body { background: white; }
            .container { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <img src="https://cdn.phototourl.com/member/2026-07-21-0de133fa-2526-4239-ad76-cc617208cc99.png" alt="Logo">
            <div>
                <h1>Rekapitulasi SIPANDU SPENPOL</h1>
                <p>Dashboard Admin SMP Negeri 1 Poli-Polia</p>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="window.print()" class="btn-print">🖨️ Cetak PDF</button>
            <button onclick="exportCSV()" class="btn-excel">📊 Export CSV</button>
        </div>
    </div>

    <!-- Layout Atas: Angka & Grafik -->
    <div class="grid-dashboard">
        <div class="stats">
            <div class="stat-card">
                <h3>Total Laporan</h3>
                <span id="t-semua">0</span>
            </div>
            <div class="stat-card">
                <h3>Menunggu & Diverifikasi</h3>
                <span id="t-baru">0</span>
            </div>
            <div class="stat-card">
                <h3>Sedang Diproses</h3>
                <span id="t-proses">0</span>
            </div>
            <div class="stat-card">
                <h3>Laporan Selesai</h3>
                <span id="t-selesai">0</span>
            </div>
        </div>
        <div class="chart-card">
            <canvas id="kategoriChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        
        <!-- MENU TAB BERWARNA -->
        <div class="tab-admin" id="tabContainer">
            <button data-tab="Semua" class="active" onclick="filterTab('Semua')">Semua Laporan</button>
            <button data-tab="Menunggu" onclick="filterTab('Menunggu')">Menunggu</button>
            <button data-tab="Diverifikasi" onclick="filterTab('Diverifikasi')">Diverifikasi</button>
            <button data-tab="Diproses" onclick="filterTab('Diproses')">Diproses</button>
            <button data-tab="Selesai" onclick="filterTab('Selesai')">Selesai</button>
            <button data-tab="Ditolak" onclick="filterTab('Ditolak')">Ditolak</button>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Cari nomor resi, nama pelapor, atau isi laporan..." onkeyup="renderTabel()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nomor Tiket</th>
                        <th>Waktu Laporan</th>
                        <th>Profil Pelapor</th>
                        <th>Kategori Layanan</th>
                        <th style="width: 250px;">Isi Laporan</th>
                        <th>Bukti</th> 
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <!-- Data masuk otomatis via JS -->
                </tbody>
            </table>
            <div id="loading">Memuat data dari server... ⏳</div>
        </div>
    </div>
</div>

<!-- MODAL KELOLA -->
<div class="modal-overlay" id="modalKelola">
    <div class="modal-box">
        <div class="modal-header">
            <span>Kelola Laporan: <span id="m-tiket" style="color:var(--secondary)"></span></span>
            <button onclick="tutupModal()" style="background:none; border:none; cursor:pointer; font-size:16px;">❌</button>
        </div>
        <div class="modal-body">
            <form id="formUpdate">
                <input type="hidden" id="in-tiket">
                <label>Ubah Status Laporan:</label>
                <select id="in-status">
                    <option value="Menunggu">Menunggu</option>
                    <option value="Diverifikasi">Diverifikasi</option>
                    <option value="Diproses">Diproses</option>
                    <option value="Selesai">Selesai</option>
                    <option value="Ditolak">Ditolak</option>
                </select>
                
                <label>Tanggapan / Balasan untuk Pelapor:</label>
                <textarea id="in-tanggapan" rows="4" placeholder="Ketik tindak lanjut atau penyelesaian masalah di sini..."></textarea>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-batal" onclick="tutupModal()">Batal</button>
            <button class="btn-simpan" id="btnSimpanUpdate" onclick="simpanUpdate()">Simpan Perubahan</button>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL GOOGLE SCRIPT (DEPLOYMENT BARU) ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHGswQ_Rz2URF7tGFZHP4YdIVGzo-H_zPdMm4N1nTe2h75avx_YvXRTFiXiGNSMykIAg/exec';
    
    let globalData = [];
    let currentTab = 'Semua';
    let chartInstance = null;

    async function muatData() {
        try {
            const response = await fetch(scriptURL);
            const json = await response.json();
            
            if(json.result === 'success') {
                globalData = json.data;
                document.getElementById('loading').style.display = 'none';
                renderTabel();
                updateStatistik();
            } else { throw new Error(json.error); }
        } catch (error) {
            document.getElementById('loading').innerHTML = '❌ Gagal memuat data. Periksa Otorisasi dan URL Script.';
            console.error(error);
        }
    }

    // Fungsi Filter Tab Navigasi dengan Efek Warna Baru
    function filterTab(status) {
        currentTab = status;
        let buttons = document.getElementById('tabContainer').getElementsByTagName('button');
        for(let btn of buttons) {
            let tabStatus = btn.getAttribute('data-tab');
            btn.className = (tabStatus === status) ? 'active' : '';
        }
        renderTabel();
    }

    // Render Tabel (Termasuk menampilkan Kategori Pengguna)
    function renderTabel() {
        let kataKunci = document.getElementById('searchInput').value.toLowerCase();
        let tbody = document.getElementById('data-body');
        let html = '';

        let dataSaring = globalData.filter(row => {
            let s = row.Status || 'Menunggu';
            let matchTab = (currentTab === 'Semua') ? true : (s === currentTab);
            let matchCari = (
                (row['Nomor Tiket']||'').toLowerCase().includes(kataKunci) ||
                (row['Nama']||'').toLowerCase().includes(kataKunci) ||
                (row['Isi Laporan']||'').toLowerCase().includes(kataKunci) ||
                (row['Kategori Pengguna']||'').toLowerCase().includes(kataKunci)
            );
            return matchTab && matchCari;
        });

        if (dataSaring.length === 0) {
            html = '<tr><td colspan="8" style="text-align:center; padding: 20px;">Tidak ada data yang sesuai.</td></tr>';
        } else {
            dataSaring.forEach(row => {
                let status = row.Status || 'Menunggu';
                let kelasBadge = 'b-menunggu';
                if(status==='Selesai') kelasBadge = 'b-selesai';
                else if(status==='Diproses') kelasBadge = 'b-diproses';
                else if(status==='Ditolak') kelasBadge = 'b-ditolak';
                else if(status==='Diverifikasi') kelasBadge = 'b-diverifikasi';
                
                let linkFoto = row['Bukti Lampiran'];
                let tombolBukti = linkFoto && linkFoto.trim() !== "" 
                    ? `<a href="${linkFoto}" target="_blank" style="color:#0ea5e9; text-decoration:none; font-weight:bold;">🖼️ Lihat</a>` 
                    : '<span style="color:#94a3b8; font-style:italic;">-</span>';

                let safeTiket = (row['Nomor Tiket']||'').replace(/'/g, "\\'");
                let safeStatus = (row['Status']||'Menunggu').replace(/'/g, "\\'");
                let safeTanggapan = (row['Tindak Lanjut']||'').replace(/'/g, "\\'").replace(/\n/g, "\\n");

                html += `
                    <tr>
                        <td><strong>${row['Nomor Tiket'] || '-'}</strong></td>
                        <td style="font-size:12px;">${row.Timestamp || '-'}</td>
                        
                        <!-- Penambahan Badge Kategori Pengguna -->
                        <td>
                            <strong>${row.Nama || '-'}</strong><br>
                            <span style="font-size:11px; padding: 2px 6px; background: #e2e8f0; border-radius: 4px; color:#475569; display:inline-block; margin-top:3px; margin-bottom:3px;">
                                👤 ${row['Kategori Pengguna'] || 'Belum diatur'}
                            </span><br>
                            <span style="font-size:12px; color:#64748b">${row.Kontak || '-'}</span>
                        </td>
                        
                        <td>${row.Kategori || '-'}</td>
                        <td style="line-height: 1.4; font-size:13px;">${row['Isi Laporan'] || '-'}</td>
                        <td>${tombolBukti}</td>
                        <td><span class="badge ${kelasBadge}">${status}</span></td>
                        <td><button class="btn-kelola" onclick="bukaModal('${safeTiket}', '${safeStatus}', '${safeTanggapan}')">Kelola</button></td>
                    </tr>
                `;
            });
        }
        tbody.innerHTML = html;
    }

    function updateStatistik() {
        let tBaru = 0, tProses = 0, tSelesai = 0;
        let kategoriCount = {};

        globalData.forEach(r => {
            let s = r.Status || 'Menunggu';
            let k = r.Kategori || 'Lainnya';
            
            if(s === 'Menunggu' || s === 'Diverifikasi') tBaru++;
            if(s === 'Diproses') tProses++;
            if(s === 'Selesai') tSelesai++;

            kategoriCount[k] = (kategoriCount[k] || 0) + 1;
        });

        document.getElementById('t-semua').innerText = globalData.length;
        document.getElementById('t-baru').innerText = tBaru;
        document.getElementById('t-proses').innerText = tProses;
        document.getElementById('t-selesai').innerText = tSelesai;

        const ctx = document.getElementById('kategoriChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(kategoriCount),
                datasets: [{
                    data: Object.values(kategoriCount),
                    backgroundColor: ['#0ea5e9', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#64748b']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: {font:{size:10}} } } }
        });
    }

    // LOGIKA MODAL TANGGAPAN
    function bukaModal(tiket, status, tanggapan) {
        document.getElementById('m-tiket').innerText = tiket;
        document.getElementById('in-tiket').value = tiket;
        document.getElementById('in-status').value = status;
        document.getElementById('in-tanggapan').value = tanggapan;
        document.getElementById('modalKelola').style.display = 'flex';
    }

    function tutupModal() {
        document.getElementById('modalKelola').style.display = 'none';
    }

    // Fungsi Kirim Update ke Backend
    function simpanUpdate() {
        const tiket = document.getElementById('in-tiket').value;
        const status = document.getElementById('in-status').value;
        const tanggapan = document.getElementById('in-tanggapan').value;
        const btn = document.getElementById('btnSimpanUpdate');

        btn.innerText = "Menyimpan...";
        btn.disabled = true;

        let formData = new FormData();
        formData.append('action', 'update');
        formData.append('tiket', tiket);
        formData.append('status', status);
        formData.append('tanggapan', tanggapan);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(json => {
                if(json.result === 'success') {
                    let row = globalData.find(r => r['Nomor Tiket'] === tiket);
                    if(row) { row.Status = status; row['Tindak Lanjut'] = tanggapan; }
                    tutupModal();
                    renderTabel();
                    updateStatistik();
                    alert("Berhasil memperbarui status laporan!");
                } else { throw new Error(json.error); }
            })
            .catch(err => {
                alert("Gagal menyimpan perubahan: " + err);
            })
            .finally(() => {
                btn.innerText = "Simpan Perubahan";
                btn.disabled = false;
            });
    }

    // FUNGSI EXPORT DATA
    function exportCSV() {
        if(globalData.length === 0) return alert("Tidak ada data untuk di-export.");
        let headers = Object.keys(globalData[0]);
        let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";

        globalData.forEach(row => {
            let rowData = headers.map(header => {
                let isi = (row[header] !== undefined && row[header] !== null) ? row[header].toString() : '';
                return '"' + isi.replace(/"/g, '""') + '"'; 
            });
            csvContent += rowData.join(",") + "\n";
        });

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Rekap_Laporan_SIPANDU.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Inisialisasi
    muatData();
</script>

</body>
</html>
