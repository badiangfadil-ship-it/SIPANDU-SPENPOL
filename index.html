<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPANDU SPENPOL - SMPN 1 Poli-Polia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #0c4a6e; --secondary-color: #0284c7; --bg-color: #f0f4f8; --text-main: #334155; --border-color: #cbd5e1; }
        body { font-family: 'Inter', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 550px; background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        .header-teks { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        .logo-sekolah { width: 100px; height: auto; margin-bottom: 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .header-teks h2 { margin: 0; color: var(--primary-color); font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .header-teks p { margin: 8px 0 0 0; color: #64748b; font-size: 15px; line-height: 1.5; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 15px; background-color: #f8fafc; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--secondary-color); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        button { width: 100%; padding: 14px; background-color: var(--secondary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: var(--primary-color); }
        #pesan { margin-top: 20px; font-weight: 600; text-align: center; display: none; padding: 15px; border-radius: 8px; font-size: 14px; }
        .pesan-sukses { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .pesan-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-teks">
        <img src="https://cdn.phototourl.com/member/2026-07-21-0de133fa-2526-4239-ad76-cc617208cc99.png" alt="Logo SMPN 1 Poli-Polia" class="logo-sekolah">
        <h2>SIPANDU SPENPOL</h2>
        <p>Sistem Informasi dan Pengaduan Terpadu<br>SMP Negeri 1 Poli-Polia</p>
    </div>
    
    <form id="formPengaduan">
        <div class="form-group">
            <label>Nama Lengkap (Boleh disamarkan):</label>
            <input type="text" name="Nama" placeholder="Contoh: Budi / Hamba Allah" required>
        </div>
        <div class="form-group">
            <label>Nomor HP / WhatsApp (Aktif):</label>
            <input type="text" name="Kontak" placeholder="Contoh: 08123456789" required>
        </div>
        <div class="form-group">
            <label>Kategori Layanan / Pengaduan:</label>
            <select name="Kategori" required>
                <option value="" disabled selected>-- Pilih Kategori Layanan --</option>
                <option value="Penerimaan & Administrasi">1. Layanan Penerimaan dan Administrasi Murid</option>
                <option value="Akademik">2. Layanan Akademik</option>
                <option value="Kesiswaan">3. Layanan Kesiswaan</option>
                <option value="Dokumen & Alumni">4. Layanan Dokumen Pendidikan dan Alumni</option>
                <option value="Informasi & Pengaduan">5. Layanan Informasi dan Pengaduan</option>
                <option value="Penunjang Pendidikan">6. Layanan Penunjang Pendidikan</option>
            </select>
        </div>
        <div class="form-group">
            <label>Detail Laporan / Permintaan:</label>
            <textarea name="Isi Laporan" rows="5" placeholder="Tuliskan secara jelas dan detail..." required></textarea>
        </div>
        <button type="submit" id="btnSubmit">Kirim Laporan Sekarang</button>
    </form>
    <div id="pesan"></div>
    <div class="footer">&copy; 2026 SMP Negeri 1 Poli-Polia.<br>Semua laporan dilindungi kerahasiaannya.</div>
</div>

<script>
    // MASUKKAN URL GOOGLE SCRIPT DI SINI (JANGAN LUPA TANDA KUTIPNYA!)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyDmPFw0ECrwVrQWw8jtA79-HOP7aqpUcQz3R7UNNgOS982FuTb9wdMsot7PCb6S9PwJQ/exec';
    
    const form = document.forms['formPengaduan'];
    const btnSubmit = document.getElementById('btnSubmit');
    const pesan = document.getElementById('pesan');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.innerHTML = "Memproses Pengiriman... ⏳";
        btnSubmit.disabled = true;
        pesan.style.display = "none";
        pesan.className = "";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => response.json())
            .then(json => {
                if(json.result === 'success'){
                    pesan.innerHTML = "✅ Laporan berhasil dikirim!";
                    pesan.classList.add("pesan-sukses");
                    form.reset();
                } else { throw new Error('Script Error'); }
                pesan.style.display = "block";
                btnSubmit.innerHTML = "Kirim Laporan Sekarang";
                btnSubmit.disabled = false;
            })
            .catch(error => {
                pesan.innerHTML = "❌ Terjadi kesalahan pengiriman.";
                pesan.classList.add("pesan-error");
                pesan.style.display = "block";
                btnSubmit.innerHTML = "Kirim Laporan Sekarang";
                btnSubmit.disabled = false;
            });
    });
</script>

</body>
</html>
