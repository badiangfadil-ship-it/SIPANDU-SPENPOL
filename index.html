<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPANDU SPENPOL - SMPN 1 Poli-Polia</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome untuk Ikon Profesional -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #0c4a6e; --secondary-color: #0284c7; --bg-color: #f0f4f8; --text-main: #334155; --border-color: #cbd5e1; }
        body { font-family: 'Inter', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 550px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        .header-teks { text-align: center; margin-bottom: 20px; }
        .logo-sekolah { width: 90px; height: auto; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .header-teks h2 { margin: 0; color: var(--primary-color); font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .header-teks p { margin: 8px 0 0 0; color: #64748b; font-size: 14px; font-weight: 600;}
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        .tab-btn.aktif { background: var(--primary-color); color: white; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 15px; background-color: #f8fafc; transition: 0.3s; }
        input[type="file"] { background-color: #fff; padding: 10px; border: 1px dashed var(--secondary-color); cursor: pointer; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--secondary-color); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        button.btn-submit, button.btn-copy { width: 100%; padding: 14px; background-color: var(--secondary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button.btn-submit:hover { background-color: var(--primary-color); }
        button.btn-copy { background-color: #10b981; padding: 10px; font-size: 14px; margin-top: 5px; }
        
        /* --- CSS BARU: TOMBOL MENU LINK PROFESIONAL --- */
        .btn-link-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn-link { 
            flex: 1; 
            padding: 15px 10px; 
            text-align: center; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 13px; 
            border-radius: 10px; 
            transition: all 0.3s ease; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: #64748b;
        }
        .btn-link i { font-size: 20px; transition: 0.3s; }
        
        /* Efek Hover (Saat disentuh/diklik) */
        .btn-survei:hover { border-color: #0ea5e9; color: #0ea5e9; background-color: #f0f9ff; box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.1); }
        .btn-info:hover { border-color: #10b981; color: #10b981; background-color: #ecfdf5; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.1); }

        @media (max-width: 480px) {
            .btn-link { font-size: 11px; padding: 12px 5px; gap: 5px; }
            .btn-link i { font-size: 16px; }
        }
        /* ------------------------------------------ */

        .notif-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 14px; display: none; }
        .sukses { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; text-align: center;}
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; text-align: center;}
        .hasil-cek { background-color: #f8fafc; border: 1px solid var(--border-color); }
        .tiket-big { font-size: 24px; font-weight: bold; color: var(--primary-color); margin: 10px 0; padding: 10px; background: white; border-radius: 5px; border: 2px dashed var(--secondary-color); display: inline-block; letter-spacing: 1px;}
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; }
        .sembunyi { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-teks">
        <img src="https://cdn.phototourl.com/member/2026-07-21-0de133fa-2526-4239-ad76-cc617208cc99.png" alt="Logo" class="logo-sekolah">
        <h2>SIPANDU SPENPOL</h2>
       <p>Sistem Informasi dan Pengaduan Terpadu<br>SMP Negeri 1 Poli-Polia</p>
    </div>

    <!-- Navigasi Menu -->
    <div class="tab-menu">
        <button class="tab-btn aktif" id="btnTabLapor" onclick="gantiTab('lapor')">✍️ Buat Laporan</button>
        <button class="tab-btn" id="btnTabCek" onclick="gantiTab('cek')">🔍 Cek Status Laporan</button>
    </div>
    
    <!-- HALAMAN 1: FORMULIR LAPORAN -->
    <div id="halamanLapor">
        <form id="formPengaduan">
            <div class="form-group">
                <label>Nama Lengkap (Boleh disamarkan):</label>
                <input type="text" name="Nama" required>
            </div>
            <div class="form-group">
                <label>Nomor HP / WhatsApp:</label>
                <input type="text" name="Kontak" required>
            </div>
            
            <div class="form-group">
                <label>Kategori Pengguna:</label>
                <select name="Kategori Pengguna" required>
                    <option value="" disabled selected>-- Pilih Kategori Anda --</option>
                    <option value="Murid">Murid</option>
                    <option value="Orang Tua/Wali">Orang Tua / Wali</option>
                    <option value="Alumni">Alumni</option>
                    <option value="Masyarakat">Masyarakat</option>
                    <option value="Instansi Pemerintah">Instansi Pemerintah</option>
                    <option value="Lembaga/Organisasi Mitra">Lembaga / Organisasi Mitra</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kategori Layanan:</label>
                <select name="Kategori" required>
                    <option value="" disabled selected>-- Pilih Kategori Layanan --</option>
                    <option value="Penerimaan & Administrasi">Penerimaan & Administrasi Murid</option>
                    <option value="Akademik">Akademik</option>
                    <option value="Kesiswaan">Kesiswaan</option>
                    <option value="Dokumen & Alumni">Dokumen Pendidikan & Alumni</option>
                    <option value="Informasi & Pengaduan">Informasi & Pengaduan</option>
                    <option value="Fasilitas & Sarpras">Fasilitas & Sarpras</option>
                </select>
            </div>
            <div class="form-group">
                <label>Detail Laporan / Permintaan:</label>
                <textarea name="Isi Laporan" rows="4" required></textarea>
            </div>
            
            <!-- UPDATE: MENDUKUNG FOTO & PDF -->
            <div class="form-group">
                <label>Lampirkan Bukti (Foto / PDF - Opsional):</label>
                <input type="file" id="inputFile" accept="image/*,.pdf" style="font-size: 13px;">
                <p style="font-size: 11px; color: #64748b; margin-top: 5px; margin-bottom: 0;">*Format: JPG/PNG/PDF. Maksimal 2MB.</p>
            </div>

            <button type="submit" id="btnKirim" class="btn-submit">Kirim Laporan Sekarang</button>
        </form>

        <!-- --- HTML BARU: 2 TOMBOL MENU LINK DENGAN IKON --- -->
        <div class="btn-link-group">
            <a href="https://badiangfadil-ship-it.github.io/APK-SKM-SPENPOL/" target="_blank" class="btn-link btn-survei">
                <i class="fas fa-clipboard-list"></i>
                Survei Kepuasan Masyarakat
            </a>
            <a href="https://docs.google.com/drawings/d/1LWxfD7K9zsOcnxSKvFG-uW48ZDPUNSlvKUQpaiIVlio/edit?usp=sharing" target="_blank" class="btn-link btn-info">
                <i class="fas fa-bullhorn"></i>
                Informasi Terbaru
            </a>
        </div>
        <!-- --------------------------------------- -->

        <div id="pesanLapor" class="notif-box"></div>
    </div>

    <!-- HALAMAN 2: CEK STATUS -->
    <div id="halamanCek" class="sembunyi">
        <div class="form-group">
            <label>Masukkan Nomor Tiket (Resi) Anda:</label>
            <input type="text" id="inputTiket" placeholder="Contoh: SPL-202681-4592" required>
        </div>
        <button onclick="cekStatus()" id="btnCek" class="btn-submit">Lacak Laporan</button>
        <div id="pesanCek" class="notif-box hasil-cek"></div>
    </div>

    <div class="footer">
        &copy; 2026 SMP Negeri 1 Poli-Polia.<br>
        Semua laporan dilindungi kerahasiaannya.
        <div style="margin-top: 10px; font-size: 11px; color: #cbd5e1;">Designed & Developed by <b>Badiang</b></div>
    </div>

<script>
    // MASUKKAN URL GOOGLE SCRIPT (DEPLOYMENT BARU) ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHGswQ_Rz2URF7tGFZHP4YdIVGzo-H_zPdMm4N1nTe2h75avx_YvXRTFiXiGNSMykIAg/exec';
    
    // Fungsi Pindah Tab
    function gantiTab(tab) {
        document.getElementById('halamanLapor').classList.add('sembunyi');
        document.getElementById('halamanCek').classList.add('sembunyi');
        document.getElementById('btnTabLapor').classList.remove('aktif');
        document.getElementById('btnTabCek').classList.remove('aktif');

        if(tab === 'lapor') {
            document.getElementById('halamanLapor').classList.remove('sembunyi');
            document.getElementById('btnTabLapor').classList.add('aktif');
        } else {
            document.getElementById('halamanCek').classList.remove('sembunyi');
            document.getElementById('btnTabCek').classList.add('aktif');
        }
    }

    // Fungsi Salin Teks
    function salinTiket(tiketId) {
        navigator.clipboard.writeText(tiketId).then(() => {
            alert("Nomor Tiket berhasil disalin: " + tiketId);
        });
    }

    // Fungsi Pengolahan Form
    const form = document.forms['formPengaduan'];
    const btnKirim = document.getElementById('btnKirim');
    const pesanLapor = document.getElementById('pesanLapor');
    const fileInput = document.getElementById('inputFile');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        btnKirim.innerHTML = "Memproses Pengiriman... ⏳";
        btnKirim.disabled = true;
        pesanLapor.style.display = "none";
        pesanLapor.className = "notif-box";

        let formData = new FormData(form);

        if (fileInput.files.length > 0) {
            btnKirim.innerHTML = "Mengunggah Lampiran... 📁";
            const file = fileInput.files[0];
            
            if(file.size > 2000000){
                pesanLapor.innerHTML = "❌ Gagal: Ukuran file maksimal 2MB.";
                pesanLapor.classList.add("error");
                pesanLapor.style.display = "block";
                btnKirim.innerHTML = "Kirim Laporan Sekarang";
                btnKirim.disabled = false;
                return;
            }

            let reader = new FileReader();
            reader.onload = function(event) {
                let base64Data = event.target.result.split(',')[1];
                formData.append('fileData', base64Data);
                formData.append('mimeType', file.type);
                formData.append('fileName', file.name);
                KirimKeServer(formData);
            };
            reader.readAsDataURL(file);
        } else {
            KirimKeServer(formData);
        }
    });

    // Fetch ke Server Google (Versi Aman)
    function KirimKeServer(formData) {
        btnKirim.innerHTML = "Menyimpan ke Database... 💾";
        
        fetch(scriptURL, { method: 'POST', body: formData })
            .then(async response => {
                const textData = await response.text();
                try {
                    return JSON.parse(textData);
                } catch (err) {
                    throw new Error("Server Google merespons dengan format salah.");
                }
            })
            .then(json => {
                if(json.result === 'success'){
                    pesanLapor.innerHTML = `✅ <b>Berhasil!</b><br>Laporan Anda telah diterima.<br><br>Simpan Nomor Tiket Anda:<br><div class="tiket-big" id="nomorBaru">${json.tiket}</div><br><button class="btn-copy" onclick="salinTiket('${json.tiket}')">📋 Salin Nomor Tiket</button>`;
                    pesanLapor.classList.add("sukses");
                    form.reset();
                    fileInput.value = "";
                } else { 
                    throw new Error(json.error || 'Error System'); 
                }
                pesanLapor.style.display = "block";
                btnKirim.innerHTML = "Kirim Laporan Sekarang";
                btnKirim.disabled = false;
            })
            .catch(error => {
                console.error(error);
                pesanLapor.innerHTML = "⚠️ Terjadi gangguan koneksi, <b>NAMUN laporan Anda mungkin sudah tersimpan.</b><br>Silakan coba 'Cek Status Laporan' Anda beberapa saat lagi sebelum mencoba mengirim ulang.";
                pesanLapor.classList.add("error");
                pesanLapor.style.display = "block";
                btnKirim.innerHTML = "Kirim Laporan Sekarang";
                btnKirim.disabled = false;
            });
    }

    // Fungsi Cek Status
    function cekStatus() {
        const tiket = document.getElementById('inputTiket').value.trim();
        const btnCek = document.getElementById('btnCek');
        const pesanCek = document.getElementById('pesanCek');

        if(tiket === "") { alert("Mohon masukkan nomor tiket!"); return; }

        btnCek.innerHTML = "Mencari... ⏳";
        btnCek.disabled = true;
        pesanCek.style.display = "none";

        fetch(scriptURL + "?action=cek&tiket=" + encodeURIComponent(tiket))
            .then(response => response.json())
            .then(json => {
                if(json.result === 'success'){
                    let status = json.data['Status'] || "Menunggu";
                    let warna = '#854d0e'; 
                    if(status === 'Selesai') warna = '#166534';
                    else if(status === 'Diproses') warna = '#6b21a8';
                    else if(status === 'Ditolak') warna = '#991b1b';
                    else if(status === 'Diverifikasi') warna = '#1d4ed8';
                    
                    pesanCek.innerHTML = `
                        <div style="border-bottom:1px solid #ccc; padding-bottom:10px; margin-bottom:10px;">
                            <strong>Status Laporan:</strong><br>
                            <span style="color:${warna}; font-weight:bold; font-size:18px; padding: 5px 10px; background: #f1f5f9; border-radius: 5px; display: inline-block; margin-top:5px;">${status}</span>
                        </div>
                        <div style="background: #e0f2fe; padding: 10px; border-radius: 8px; border-left: 4px solid #0284c7;">
                            <strong>Tanggapan Admin:</strong><br>
                            <p style="margin-top:5px; line-height:1.5;">${json.data['Tindak Lanjut']}</p>
                        </div>
                    `;
                } else {
                    pesanCek.innerHTML = "❌ Nomor tiket tidak ditemukan.";
                }
                pesanCek.style.display = "block";
                btnCek.innerHTML = "Lacak Laporan";
                btnCek.disabled = false;
            })
            .catch(err => {
                pesanCek.innerHTML = "❌ Gagal memuat data. Periksa internet Anda.";
                pesanCek.style.display = "block";
                btnCek.innerHTML = "Lacak Laporan";
                btnCek.disabled = false;
            });
    }
</script>

</body>
</html>
