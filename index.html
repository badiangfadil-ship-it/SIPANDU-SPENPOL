<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPANDU SPENPOL - SMPN 1 Poli-Polia</title>
    <!-- Menggunakan font modern dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0c4a6e; /* Biru gelap elegan khas instansi */
            --secondary-color: #0284c7; /* Biru cerah untuk tombol */
            --bg-color: #f0f4f8; /* Abu-abu kebiruan untuk background */
            --text-main: #334155;
            --border-color: #cbd5e1;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container { 
            width: 100%;
            max-width: 550px; 
            background: white; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            box-sizing: border-box;
        }

        .header-teks { 
            text-align: center; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .logo-sekolah {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .header-teks h2 { 
            margin: 0; 
            color: var(--primary-color); 
            font-size: 26px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-teks p { 
            margin: 8px 0 0 0; 
            color: #64748b; 
            font-size: 15px; 
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        /* Efek ketika kolom di-klik (fokus) */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--secondary-color); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover { 
            background-color: var(--primary-color); 
        }

        button:active {
            transform: scale(0.98);
        }

        #pesan { 
            margin-top: 20px; 
            font-weight: 600; 
            text-align: center; 
            display: none; 
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .pesan-sukses { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .pesan-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-teks">
        <!-- Logo Aplikasi disematkan di sini -->
        <img src="https://cdn.phototourl.com/member/2026-07-21-0de133fa-2526-4239-ad76-cc617208cc99.png" alt="Logo SMPN 1 Poli-Polia" class="logo-sekolah">
        <h2>SIPANDU SPENPOL</h2>
        <p>Sistem Informasi dan Pengaduan Terpadu<br>SMP Negeri 1 Poli-Polia</p>
    </div>
    
    <form id="formPengaduan">
        <div class="form-group">
            <label>Nama Lengkap (Boleh disamarkan):</label>
            <input type="text" name="Nama" placeholder="Contoh: Budi / Hamba Allah" required>
        </div>

        <div class="form-group">
            <label>Nomor HP / WhatsApp (Aktif):</label>
            <input type="text" name="Kontak" placeholder="Contoh: 08123456789" required>
        </div>

        <div class="form-group">
            <label>Kategori Laporan / Informasi:</label>
            <select name="Kategori" required>
                <option value="" disabled selected>-- Pilih Kategori --</option>
                <option value="Fasilitas">Fasilitas Sekolah (Gedung, Toilet, Kelas)</option>
                <option value="Pelayanan">Pelayanan Guru / Staf TU</option>
                <option value="Bullying/Keamanan">Keamanan & Bullying</option>
                <option value="Info Akademik">Informasi PPDB / Akademik</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

        <div class="form-group">
            <label>Detail Laporan / Permintaan:</label>
            <textarea name="Isi Laporan" rows="5" placeholder="Tuliskan secara jelas dan detail laporan atau permintaan informasi Anda di sini..." required></textarea>
        </div>

        <button type="submit" id="btnSubmit">Kirim Laporan Sekarang</button>
    </form>
    
    <div id="pesan"></div>

    <div class="footer">
        &copy; 2026 SMP Negeri 1 Poli-Polia.<br>Semua laporan dilindungi kerahasiaannya.
    </div>
</div>

<script>
    // PASTIKAN MENGGANTI TEKS DI BAWAH DENGAN URL WEB APP GOOGLE SCRIPT YANG ASLI
    const scriptURL = 'URL_WEB_APP_GOOGLE_SCRIPT_ANDA_DISINI';
    const form = document.forms['formPengaduan'];
    const btnSubmit = document.getElementById('btnSubmit');
    const pesan = document.getElementById('pesan');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // Animasi loading saat dikirim
        btnSubmit.innerHTML = "Memproses Pengiriman... ⏳";
        btnSubmit.style.opacity = "0.7";
        btnSubmit.disabled = true;
        pesan.style.display = "none";
        pesan.className = "";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                pesan.innerHTML = "✅ Laporan berhasil dikirim! Terima kasih atas partisipasi Anda membangun sekolah kita.";
                pesan.classList.add("pesan-sukses");
                pesan.style.display = "block";
                form.reset();
                kembalikanTombol();
            })
            .catch(error => {
                pesan.innerHTML = "❌ Terjadi kesalahan! Pastikan koneksi internet stabil dan coba lagi.";
                pesan.classList.add("pesan-error");
                pesan.style.display = "block";
                kembalikanTombol();
            });
    });

    function kembalikanTombol() {
        btnSubmit.innerHTML = "Kirim Laporan Sekarang";
        btnSubmit.style.opacity = "1";
        btnSubmit.disabled = false;
    }
</script>

</body>
</html>
